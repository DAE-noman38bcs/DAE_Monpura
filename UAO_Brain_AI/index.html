<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>MonpuraCopilot Dashboard</title>
<link rel="stylesheet" href="assets/monpuracopilot.style.css">
</head>
<body>
  <header class="monpuracopilot-header monpuracopilot-header--dark monpuracopilot-header--sticky u-flex u-flex-between u-px-4 u-py-2">
    <h1 class="monpuracopilot-title u-text-lg u-font-bold">MonpuraCopilot</h1>
  </header>
  <main class="monpuracopilot-main u-container u-grid u-grid-cols-2 u-gap-4 u-mt-4">
    <section class="monpuracopilot-card monpuracopilot-card--engine u-p-3 u-rounded u-shadow-sm">
      <h2 class="u-text-sm u-text-muted">Engine Status</h2>
      <p id="status" class="u-text-xl">initializing…</p>
    </section>
    <section class="monpuracopilot-card monpuracopilot-card--log u-p-3 u-rounded u-shadow-sm">
      <h2 class="u-text-sm u-text-muted">Recent Log</h2>
      <pre id="log" class="u-text-xs"></pre>
    </section>
  </main>
  <footer class="u-text-xs u-text-muted u-p-3">Developer: Mahmud Abdullah Al Naman (মাহমুদ আব্দুল্লাহ আল নোমান) | noman38bcs@gmail.com | 01623015273</footer>
  <script src="src/monpuracopilot.widget.js"></script>
</body>
</html>
